name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK (global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore src/Squish.sln

      - name: Build solution
        run: dotnet build src/Squish.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/Squish.sln --configuration Release --no-build

      - name: Stage third-party tools
        shell: pwsh
        run: ./scripts/fetch-tools.ps1

      - name: Publish artifacts
        shell: pwsh
        run: |
          $rid = 'win-x64'
          $publishRoot = 'out/publish'
          if (Test-Path $publishRoot) { Remove-Item $publishRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $publishRoot | Out-Null

          dotnet publish src/App/Squish.App.csproj --configuration Release --runtime $rid --self-contained:$false --output "$publishRoot/app"
          dotnet publish src/CliBridge/Squish.CliBridge.csproj --configuration Release --runtime $rid --self-contained:$true --output "$publishRoot/cli"
          dotnet publish src/Integrations/Explorer/Squish.Integrations.Explorer.csproj --configuration Release --runtime $rid --self-contained:$false --output "$publishRoot/explorer"

          $docsTarget = Join-Path $publishRoot 'docs'
          New-Item -ItemType Directory -Path $docsTarget -Force | Out-Null
          Copy-Item docs/windows-deps.md $docsTarget -Force
          Copy-Item docs/cli.md $docsTarget -Force
          Copy-Item docs/automation-samples.md $docsTarget -Force
          Copy-Item installer/SQUISH_LICENSE.txt $publishRoot -Force
          $toolsTarget = Join-Path $publishRoot 'tools'
          if (Test-Path $toolsTarget) { Remove-Item $toolsTarget -Recurse -Force }
          New-Item -ItemType Directory -Path $toolsTarget | Out-Null
          Copy-Item "tools/*" $toolsTarget -Recurse -Force

      - name: Determine version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare artifact folders
        shell: pwsh
        run: |
          Remove-Item artifacts,portable -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path artifacts | Out-Null
          New-Item -ItemType Directory -Path portable | Out-Null
          Copy-Item "out/publish/*" portable -Recurse -Force

      - name: Create portable zip
        shell: pwsh
        run: |
          $zipName = "Squish-$env:APP_VERSION-win-x64"
          $portableSource = 'portable'
          $targetFolder = Join-Path 'artifacts' $zipName
          if (Test-Path $targetFolder) { Remove-Item $targetFolder -Recurse -Force }
          New-Item -ItemType Directory -Path $targetFolder | Out-Null
          Copy-Item "$portableSource/*" $targetFolder -Recurse -Force
          Compress-Archive -Path (Join-Path $targetFolder '*') -DestinationPath ("$targetFolder.zip") -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          $appVersion = $env:APP_VERSION
          $appOut = Resolve-Path 'out/publish/app'
          $cliOut = Resolve-Path 'out/publish/cli'
          $explorerOut = Resolve-Path 'out/publish/explorer'
          & $iscc /Qp `
            "/DMyAppVersion=$appVersion" `
            "/DAppBuildOutput=$appOut" `
            "/DCliBuildOutput=$cliOut" `
            "/DExplorerBuildOutput=$explorerOut" `
            "/DToolsRoot=$(Resolve-Path out/publish/tools)" `
            'installer/SquishInstaller.iss'
          Copy-Item installer/Output/*.exe artifacts -Force

      - name: Write checksums and release notes
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object FullName)
          # Hash the files and write SHA256SUMS.txt. The README block it also rewrites here is a scratch copy:
          # the update-readme job does the real update on the default branch.
          ./scripts/update-release-integrity.ps1 `
            -Version $env:APP_VERSION `
            -Files $files `
            -ChecksumsPath 'artifacts/SHA256SUMS.txt' `
            -Repository '${{ github.repository }}'

          $installer = "Squish-Setup-$($env:APP_VERSION).exe"
          $sha = (Get-FileHash "artifacts/$installer" -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @(
            "Download **$installer** and run it. Squish is unsigned, so Windows SmartScreen may warn.",
            '',
            'SHA256 of the installer:',
            '',
            '```',
            $sha,
            '```',
            '',
            'Check your download in PowerShell (prints `True` when it matches):',
            '',
            '```powershell',
            "(Get-FileHash .\$installer -Algorithm SHA256).Hash -eq '$sha'",
            '```',
            '',
            'All hashes are in `SHA256SUMS.txt`.'
          ) -join "`n"
          Set-Content -Path "$env:RUNNER_TEMP/release-notes.md" -Value $notes -Encoding utf8

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: squish-windows-release
          path: artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Squish ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-readme:
    # Puts the new version, hashes and verify command in the README's "Installer integrity" section through a pull
    # request against the default branch. Pull requests opened with the default GITHUB_TOKEN do not start the ci
    # workflow; add a fine-grained token with contents and pull-requests write access as RELEASE_README_TOKEN to
    # have CI run on them too. "Allow GitHub Actions to create and approve pull requests" must be on.
    needs: build-package
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download release checksums
        uses: actions/download-artifact@v4
        with:
          name: squish-windows-release
          path: release

      - name: Update README
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/update-release-integrity.ps1 `
            -Version $version `
            -FromChecksums release/SHA256SUMS.txt `
            -Repository '${{ github.repository }}'

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_README_TOKEN || github.token }}
          branch: chore/readme-${{ github.ref_name }}
          delete-branch: true
          add-paths: README.md
          commit-message: "docs: update README for Squish ${{ github.ref_name }}"
          title: "docs: update README checksums for Squish ${{ github.ref_name }}"
          body: |
            Automated by the release workflow after publishing [Squish ${{ github.ref_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}).

            Updates the version, SHA256 checksums and verify commands in the README's *Installer integrity* section. Nothing else changes.
